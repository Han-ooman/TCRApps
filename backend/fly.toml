# fly.toml app configuration file for tcrapps-api (TCRApps backend API).
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'tcrapps-api'
primary_region = 'sin'

[build]
  dockerfile = './Dockerfile'

[env]
  NODE_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250
